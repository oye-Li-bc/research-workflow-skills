name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify tag and notes
        run: |
          python -c "import os; from pathlib import Path; v=Path('VERSION').read_text().strip(); assert os.environ['GITHUB_REF_NAME']=='v'+v; assert Path('docs/releases/v'+v+'.md').is_file()"
      - name: Validate and test
        run: |
          python tools/skillctl.py validate
          python -m unittest discover -s tests -v
      - name: Build distribution
        run: python tools/skillctl.py build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --verify-tag --title "Research Workflow Skills $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
