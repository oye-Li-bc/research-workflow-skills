    <text x="60" y="276" fill="#f8f7ef" font-size="76" font-weight="700" letter-spacing="-3">Workflow Skills<tspan fill="#abebcc">.</tspan></text>
    <text x="64" y="328" fill="#b7c8cc" font-size="24">Read papers. Work in notebooks. Keep knowledge.</text>
    <g font-size="16" font-weight="600">
