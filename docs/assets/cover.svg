<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Research Workflow Skills</title>
  <desc id="desc">A portable library for papers, notebooks and research notes. Seven skills and four Python helpers, illustrated by connected research documents.</desc>
  <defs>
