    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f9f7ee"/><stop offset="1" stop-color="#dae9df"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050e16" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1440" height="520" rx="24" fill="url(#bg)"/>
  <rect x="790" width="650" height="520" rx="24" fill="url(#grid)" opacity=".45"/>
  <circle cx="1176" cy="245" r="188" fill="none" stroke="#31515a"/>
  <circle cx="1176" cy="245" r="225" fill="none" stroke="#31515a" stroke-dasharray="3 11"/>
